services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beatdown
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beatdown"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../../
      dockerfile: apps/beatdown-app/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/beatdown
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
